[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gatekeeper-ai"
version = "0.1.0"
description = "Pre-delivery LLM response monitoring & brand safety"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Gatekeeper AI", email = "founders@gatekeeper.ai"}
]
keywords = ["llm", "ai", "monitoring", "brand-safety", "hallucination", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.20.0"]
redis = ["redis>=5.0.0"]
async = ["aiohttp>=3.9.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://gatekeeper.ai"
Repository = "https://github.com/gatekeeper-ai/gatekeeper-ai"
Documentation = "https://docs.gatekeeper.ai"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
